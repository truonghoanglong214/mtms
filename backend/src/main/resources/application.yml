server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mtms-backend
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
