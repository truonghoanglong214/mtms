spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtms}
    username: ${SPRING_DATASOURCE_USERNAME:mtms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:mtms_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: mtms
    schemas: mtms
    create-schemas: true
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    baseline-on-migrate: false
    locations: filesystem:../database/migrations
