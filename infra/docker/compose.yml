name: mtms

services:
  postgres:
    image: postgres:17-alpine
    container_name: mtms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mtms}
      POSTGRES_USER: ${POSTGRES_USER:-mtms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mtms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mtms_user} -d ${POSTGRES_DB:-mtms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mtms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mtms}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mtms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/migrations
      SPRING_FLYWAY_DEFAULT_SCHEMA: mtms
      SPRING_FLYWAY_SCHEMAS: mtms
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      SPRING_FLYWAY_OUT_OF_ORDER: "false"
      SPRING_FLYWAY_CLEAN_DISABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SERVER_PORT: 8080
    volumes:
      - ../../database/migrations:/app/migrations:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mtms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mtms-pgdata:
    name: mtms-pgdata
